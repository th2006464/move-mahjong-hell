<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>挪对对 · SVG 麻将牌面预览</title>
  <style>
    :root{--ink:#174f4c;--paper:#f5f7f1;--red:#d32032;--blue:#20458e;--green:#176c43;--line:#aebbb8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#a8e2f3,#dff6f7 58%,#9bd9ed);font-family:"PingFang SC",Arial,sans-serif;color:var(--ink)}
    header{padding:28px 20px 22px;text-align:center;background:linear-gradient(#ffad75,#f78e59);color:#fff8e8;text-shadow:1px 2px #92593d}h1{margin:0;font-size:26px}header p{max-width:640px;margin:8px auto 0;font-size:14px;line-height:1.5;text-shadow:none;color:#6a493a;font-weight:700}
    main{width:min(1120px,100%);margin:auto;padding:20px 14px 42px}.note{margin:0 auto 18px;padding:12px 14px;max-width:840px;border:1px solid #7ab7a9;border-radius:12px;background:#f7fff8;color:#386c62;font-size:14px;line-height:1.55}
    .section{margin:18px 0 24px;padding:14px;border:4px solid #a9663a;border-radius:16px;background:#55bd91;box-shadow:inset 0 0 12px #176b5e80,0 3px #66999a}.section h2{margin:0 0 12px;padding-left:4px;color:#fff9e5;text-shadow:1px 2px #3d7366;font-size:18px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:9px}
    .sample{min-width:0;padding:6px 4px 5px;border-radius:7px;background:#eaf7efcc;text-align:center;box-shadow:0 1px #246f60}.sample b{display:block;margin-top:4px;font-size:12px;color:#275e55}.tile{display:grid;place-items:center;width:100%;aspect-ratio:1/1.28;border:1px solid var(--line);border-radius:1px;background:linear-gradient(100deg,#edf1ec,#fcfdf9 48%,#eef1ec);box-shadow:inset 0 0 2px #fff,0 1px 1px #4a777555;overflow:hidden}.tile svg{width:98%;height:98%;display:block}
    .palette{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px auto;max-width:840px}.swatch{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:20px;background:#ffffffaa;font-size:12px;font-weight:800}.dot{width:14px;height:14px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px #708e86}
    footer{text-align:center;color:#4d7772;font-size:12px}@media(max-width:520px){header{padding-top:22px}h1{font-size:22px}.tiles{grid-template-columns:repeat(5,1fr);gap:6px}.section{padding:8px;border-width:3px}.section h2{font-size:15px;margin-bottom:7px}.sample{padding:4px 2px;border-radius:5px}.sample b{margin-top:3px;font-size:10px}.note{font-size:12px}}
  </style>
</head>
<body>
  <header>
    <h1>挪对对 · SVG 麻将牌面预览</h1>
    <p>独立视觉试验页：不影响当前游戏。所有图案均由 SVG 代码绘制，可统一控制颜色、线宽、比例与细节。</p>
  </header>
  <main>
    <p class="note">当前方向：用深蓝、朱红、墨绿三种主色重新绘制牌面。你确认视觉后，再把这一套 SVG 接入游戏；届时不会改变配对、拖动、存档或排行榜逻辑。</p>
    <div class="palette">
      <span class="swatch"><i class="dot" style="background:#20458e"></i>万字蓝 #20458E</span><span class="swatch"><i class="dot" style="background:#d32032"></i>万字红 #D32032</span><span class="swatch"><i class="dot" style="background:#176c43"></i>条子绿 #176C43</span><span class="swatch"><i class="dot" style="background:#315c9e"></i>饼子蓝 #315C9E</span><span class="swatch"><i class="dot" style="background:#d83a4b"></i>饼子红 #D83A4B</span>
    </div>
    <section class="section"><h2>萬子</h2><div class="tiles" id="man"></div></section>
    <section class="section"><h2>條子</h2><div class="tiles" id="bam"></div></section>
    <section class="section"><h2>餅子</h2><div class="tiles" id="dot"></div></section>
    <section class="section"><h2>三元牌</h2><div class="tiles" id="dragon"></div></section>
    <footer>SVG 预览版 · 仅用于确定牌面视觉方向</footer>
  </main>
  <script>
    const NS='http://www.w3.org/2000/svg';
    const colors={red:'#d32032',blue:'#20458e',green:'#176c43',dotBlue:'#315c9e',dotRed:'#d83a4b',dark:'#124f38',paper:'#f7f8f3'};
    const cn=['一','二','三','四','五','六','七','八','九'];
    const svg=(content,label)=>`<svg viewBox="0 0 100 122" role="img" aria-label="${label}" xmlns="${NS}">${content}</svg>`;
    const stroke=(color,width=3)=>`fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"`;
    function man(n){return svg(`<text x="50" y="45" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="40" font-weight="800" fill="${colors.blue}" stroke="${colors.blue}" stroke-width=".45">${cn[n-1]}</text><text x="50" y="91" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="43" font-weight="900" fill="${colors.red}" stroke="${colors.red}" stroke-width=".35">萬</text>`,`${cn[n-1]}萬`)}
    function bird(){return `<g stroke="${colors.green}" stroke-linecap="round" stroke-linejoin="round"><path d="M35 90c8-15 7-29 12-39 4-9 12-16 21-15 7 1 11 6 10 11-1 5-7 8-14 7 3 13 1 29-9 40" fill="#f7f8f3" stroke-width="3"/><path d="M48 55c-9-5-17-4-24 1 7 2 12 6 16 12M51 65c10 0 17 5 23 14-11-4-18-4-24 0M47 78l-17 18M52 82l-6 20M59 81l8 16" fill="none" stroke-width="2.8"/><path d="M71 36l1-8M67 36l-3-7M76 39l7-4" fill="none" stroke="${colors.dotRed}" stroke-width="2.4"/><path d="M77 43l10 3-10 4" fill="${colors.dotRed}" stroke-width="1.8"/><circle cx="70" cy="42" r="2" fill="${colors.dotRed}" stroke="none"/><path d="M50 63c5 3 8 7 9 13M46 70c5 2 8 6 9 11" fill="none" stroke-width="1.7"/></g>`}
    function bambooStick(x,y,color=colors.green){return `<g ${stroke(color,2.8)}><rect x="${x-3.6}" y="${y-14}" width="7.2" height="28" rx="3.4"/><path d="M${x-3.3} ${y-5}h6.6M${x-3.3} ${y+5}h6.6" stroke-width="1.5"/></g>`}
    const bamPositions={2:[[34,35],[66,86]],3:[[34,30],[66,60],[34,91]],4:[[32,34],[68,34],[32,86],[68,86]],5:[[30,30],[70,30],[50,60],[30,91],[70,91]],6:[[31,26],[69,26],[31,60],[69,60],[31,94],[69,94]],7:[[31,24],[69,24],[50,49],[31,68],[69,68],[31,97],[69,97]],8:[[33,20],[67,20],[33,47],[67,47],[33,74],[67,74],[33,101],[67,101]],9:[[27,23],[50,23],[73,23],[27,60],[50,60],[73,60],[27,97],[50,97],[73,97]]};
    const bamReds={3:[1],5:[2],6:[2,3],7:[2],8:[3,4],9:[4]};
    function bam(n){if(n===1)return svg(bird(),'一條');const ps=bamPositions[n];return svg(ps.map(([x,y],i)=>bambooStick(x,y,(bamReds[n]||[]).includes(i)?colors.dotRed:colors.green)).join(''),`${cn[n-1]}條`)}
    function pip(x,y,color,r=7.8){return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="${colors.paper}" stroke="${color}" stroke-width="2.8"/><circle cx="${x}" cy="${y}" r="${r-3.1}" fill="none" stroke="${color}" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="2" fill="${color}"/></g>`}
    const dotPositions={2:[[34,33],[66,88]],3:[[34,26],[50,60],[66,95]],4:[[31,31],[69,31],[31,89],[69,89]],5:[[30,30],[70,30],[50,60],[30,91],[70,91]],6:[[31,25],[69,25],[31,60],[69,60],[31,95],[69,95]],7:[[31,23],[69,23],[50,45],[31,67],[69,67],[31,96],[69,96]],8:[[33,19],[67,19],[33,46],[67,46],[33,74],[67,74],[33,101],[67,101]],9:[[27,22],[50,22],[73,22],[27,60],[50,60],[73,60],[27,98],[50,98],[73,98]]};
    const pipColors={2:['blue','green'],3:['blue','red','green'],4:['green','green','red','red'],5:['green','green','red','green','green'],6:['blue','blue','red','red','green','green'],7:['blue','blue','red','green','green','green','green'],8:['blue','blue','blue','blue','blue','blue','blue','blue'],9:['green','green','green','red','red','red','blue','blue','blue']};
    function dot(n){if(n===1)return svg(`<circle cx="50" cy="60" r="28" fill="${colors.paper}" stroke="${colors.blue}" stroke-width="2.6"/><circle cx="50" cy="60" r="23" fill="${colors.green}"/><circle cx="50" cy="60" r="17" fill="${colors.paper}"/><circle cx="50" cy="60" r="12" fill="${colors.dotRed}"/><circle cx="50" cy="60" r="6" fill="#f8e89b"/><path d="M50 43v34M33 60h34M38 48l24 24M62 48L38 72" ${stroke(colors.green,1.5)}/>`,'一餅');const ps=dotPositions[n];return svg(ps.map(([x,y],i)=>pip(x,y,colors[pipColors[n][i]==='blue'?'dotBlue':pipColors[n][i]==='red'?'dotRed':'green'],n>=8?6.7:7.8)).join(''),`${cn[n-1]}餅`)}
    function dragon(type){if(type==='red')return svg(`<text x="50" y="81" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="61" font-weight="900" fill="${colors.red}">中</text>`,'红中');if(type==='green')return svg(`<text x="50" y="80" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="56" font-weight="900" fill="${colors.green}">發</text>`,'发财');return svg(`<rect x="24" y="22" width="52" height="77" rx="2" fill="none" stroke="${colors.blue}" stroke-width="5"/><rect x="31" y="29" width="38" height="63" fill="none" stroke="${colors.blue}" stroke-width="1.5"/>`,'白板')}
    function sample(label,face){return `<article class="sample"><div class="tile">${face}</div><b>${label}</b></article>`}
    document.querySelector('#man').innerHTML=cn.map((x,i)=>sample(`${x}萬`,man(i+1))).join('');
    document.querySelector('#bam').innerHTML=cn.map((x,i)=>sample(`${x}條`,bam(i+1))).join('');
    document.querySelector('#dot').innerHTML=cn.map((x,i)=>sample(`${x}餅`,dot(i+1))).join('');
    document.querySelector('#dragon').innerHTML=[['红中','red'],['发财','green'],['白板','white']].map(([label,type])=>sample(label,dragon(type))).join('');
  </script>
</body>
</html>
