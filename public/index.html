<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>挪对对 · 地狱模式</title><style>
:root{--sky:#a9ddef;--wood:#9d6743;--green:#3ac777;--ink:#215b54}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ff9c62 0 15%,var(--sky) 15%);font-family:"PingFang SC",Arial,sans-serif;color:var(--ink);user-select:none}.app{height:100dvh;max-width:620px;margin:auto;padding:10px 8px;display:flex;flex-direction:column}.hud{height:66px;display:flex;align-items:center;gap:12px}.pause{width:59px;height:59px;border:5px solid #f4d72c;border-radius:50%;background:#44cb7d;box-shadow:inset 0 0 0 5px #ed6335,0 3px #885338;color:#fff;font-size:27px}.meters{flex:1}.meter{height:22px;margin:4px 0;padding-left:8px;line-height:16px;border:3px solid #914d34;border-radius:18px;background:#bd6b43;overflow:hidden;color:#fff;font-weight:900}.meter:before{content:"";display:block;width:53%;height:100%;margin:-16px 0 0 -8px;background:#f4c544}.coins:before{width:70%;background:#e6e5b7}.meter b{position:relative;top:-17px}.more{padding:7px 13px;border:0;border-radius:18px;background:#fff1db;color:#5d4c45;font-size:28px}.title{margin:4px 0 2px;text-align:center;color:#fff6e3;font-size:24px;line-height:1;text-shadow:2px 3px #825139}.status{height:24px;text-align:center;font-size:14px;font-weight:800}.board{--tile:min(calc((100vw - 32px)/20),calc((100dvh - 110px)/24));display:grid;grid-template-columns:repeat(20,var(--tile));grid-template-rows:repeat(24,var(--tile));gap:1px;align-self:center;padding:6px;border:6px solid var(--wood);border-radius:15px;background:var(--green);box-shadow:0 4px #6f9f98;touch-action:none}.tile{width:var(--tile);height:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #acc7ae;border-radius:3px;background:linear-gradient(145deg,#fffef4,#e9eddd);box-shadow:1px 2px #8ba98f,inset 0 0 0 1px #fff;font-weight:900;line-height:.7;transition:transform .1s}.empty{border:0;background:transparent;box-shadow:none}.selected{z-index:2;outline:3px solid #ffe037;box-shadow:0 0 0 2px #fff4a8,1px 2px #8ba98f;transform:scale(1.09)}.glyph{font-family:"Noto Sans Symbols 2","Segoe UI Symbol","Arial Unicode MS",sans-serif;font-size:calc(var(--tile)*.76);font-weight:700;line-height:1}.man{color:#d04436}.bam{color:#2b8b5f}.dot{color:#3779a8}.wind{color:#296c60}.dragon{color:#d2433b}.fly{position:fixed;z-index:20;pointer-events:none;transition:transform .18s ease-out}.hint{z-index:3;animation:hint .42s alternate 5}@keyframes hint{to{background:#ffe85b;transform:scale(1.13)}}body:has(.hint) .tile:not(.hint){filter:brightness(.32)}.legend{height:23px;margin-top:4px;text-align:center;font-size:12px}.tools{display:flex;justify-content:center;gap:8px;margin-top:4px}.tool{border:3px solid #22509a;border-radius:13px;background:linear-gradient(#75aaf6,#477ed8);box-shadow:0 3px #244676;padding:7px 11px;color:#fff;font-size:15px;font-weight:900}@media(max-height:700px){.app{padding-top:6px}.hud{height:57px}.pause{width:51px;height:51px}.board{--tile:min(calc((100vw - 32px)/20),calc((100dvh - 105px)/24))}.tool{padding:5px 8px}}
</style></head><body><main class="app"><h1 class="title">挪对对 · 地狱模式</h1><div class="status" id="status">点击相邻同牌，或拖动麻将进入空位</div><div class="board" id="board"></div><div class="legend">只能横向 / 纵向挪动 · 路径必须全为空位</div><div class="tools"><button class="tool" id="hint">💡 提示 <span>3</span></button><button class="tool" id="shuffle">🔀 洗牌</button><button class="tool" id="bomb">💣 炸弹 <span>1</span></button><button class="tool" id="restart">↻ 重开</button></div></main><script>
const ROWS=24,COLS=20,GLYPHS=["🀇︎","🀈︎","🀉︎","🀊︎","🀋︎","🀌︎","🀍︎","🀎︎","🀏︎","🀐︎","🀑︎","🀒︎","🀓︎","🀔︎","🀕︎","🀖︎","🀗︎","🀘︎","🀙︎","🀚︎","🀛︎","🀜︎","🀝︎","🀞︎","🀟︎","🀠︎","🀡︎","🀀︎","🀁︎","🀂︎","🀃︎","🀄︎","🀅︎","🀆︎"],TYPES=GLYPHS.map((glyph,i)=>({id:"t"+i,glyph,kind:i<9?"man":i<18?"bam":i<27?"dot":i<31?"wind":"dragon"}));const $=id=>document.getElementById(id);let grid=[],selected=null,score=0,hints=3,bombs=1,paused=false,drag=null,animating=false;
function status(t){$('status').textContent=t}
function inside(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS}
function same(a,b){return a&&b&&a.id===b.id}
function fresh(){let cards=[];for(let i=0;i<ROWS*COLS/2;i++)cards.push(TYPES[i%TYPES.length],TYPES[i%TYPES.length]);cards.sort(()=>Math.random()-.5);grid=Array.from({length:ROWS},(_,r)=>cards.slice(r*COLS,(r+1)*COLS));selected=null;score=0;render();status('点击相邻同牌，或拖动麻将进入空位')}
function render(){let b=$('board');b.replaceChildren();grid.forEach((row,r)=>row.forEach((card,c)=>{let e=document.createElement('div');e.className=card?`tile ${card.kind}`:'tile empty';e.dataset.r=r;e.dataset.c=c;if(card){e.innerHTML=`<span class="glyph">${card.glyph}</span>`;if(selected?.r===r&&selected?.c===c)e.classList.add('selected')}b.append(e)}));$('score').textContent=score;$('hint').innerHTML=`💡 提示 <span>${hints}</span>`;$('bomb').innerHTML=`💣 炸弹 <span>${bombs}</span>`}
function clear(a,b){if(a.r===b.r){for(let c=Math.min(a.c,b.c)+1;c<Math.max(a.c,b.c);c++)if(grid[a.r][c])return false;return true}if(a.c===b.c){for(let r=Math.min(a.r,b.r)+1;r<Math.max(a.r,b.r);r++)if(grid[r][a.c])return false;return true}return false}
function near(p){let card=grid[p.r][p.c];return [[-1,0],[1,0],[0,-1],[0,1]].map(([dr,dc])=>({r:p.r+dr,c:p.c+dc})).find(q=>inside(q.r,q.c)&&same(card,grid[q.r][q.c]))}
function remove(a,b,msg){grid[a.r][a.c]=null;grid[b.r][b.c]=null;score+=10;selected=null;render();status(msg)}
function tap(p){
  if(paused||animating)return;
  const card=grid[p.r][p.c];
  if(!card){
    if(!selected){status('请先点击一张麻将');return}
    if((selected.r!==p.r&&selected.c!==p.c)||!clear(selected,p)){status('只能点击同一行或列的连续空位');return}
    animateMove(selected,p);
    return;
  }
  const pair=near(p);
  if(pair){remove(p,pair,'相邻配对成功！');return}
  selected=p;render();status('黄框已选中：点击同一行或列的空位')
}
function aligned(p){let card=grid[p.r][p.c];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let q={r,c};if((r!==p.r||c!==p.c)&&same(card,grid[r][c])&&clear(p,q))return q}return null}
function animateMove(fromPos,toPos){
  const card=grid[fromPos.r][fromPos.c];
  const source=[...board.children].find(e=>+e.dataset.r===fromPos.r&&+e.dataset.c===fromPos.c);
  const from=source.getBoundingClientRect();
  grid[fromPos.r][fromPos.c]=null;selected=null;render();
  const target=[...board.children].find(e=>+e.dataset.r===toPos.r&&+e.dataset.c===toPos.c);
  const to=target.getBoundingClientRect(),fly=source.cloneNode(true);
  fly.classList.add('fly');Object.assign(fly.style,{left:`${from.left}px`,top:`${from.top}px`,width:`${from.width}px`,height:`${from.height}px`});document.body.append(fly);animating=true;
  requestAnimationFrame(()=>{fly.style.transform=`translate(${to.left-from.left}px,${to.top-from.top}px)`});
  setTimeout(()=>{fly.remove();grid[toPos.r][toPos.c]=card;animating=false;const pair=aligned(toPos);if(pair)remove(toPos,pair,'对齐成功，自动消除！');else{render();status('已挪动，继续寻找同牌')}},190)
}
function move(p,dr,dc){
  if(paused||animating)return;
  let r=p.r+dr,c=p.c+dc,last=null;
  while(inside(r,c)&&!grid[r][c]){last={r,c};r+=dr;c+=dc}
  if(!last){status('这个方向没有连续空位');return}
  animateMove(p,last)
}

let board=$('board');board.addEventListener('pointerdown',e=>{let el=e.target.closest('.tile');if(!el)return;drag={p:{r:+el.dataset.r,c:+el.dataset.c},x:e.clientX,y:e.clientY};board.setPointerCapture?.(e.pointerId)});board.addEventListener('pointerup',e=>{if(!drag)return;let d=drag,dx=e.clientX-d.x,dy=e.clientY-d.y;drag=null;if(Math.max(Math.abs(dx),Math.abs(dy))<8)tap(d.p);else if(grid[d.p.r][d.p.c]){if(Math.abs(dx)>Math.abs(dy))move(d.p,0,dx>0?1:-1);else move(d.p,dy>0?1:-1,0)}});board.addEventListener('pointercancel',()=>drag=null);
$('hint').onclick=()=>{if(!hints)return;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let p={r,c},q=grid[r][c]&&near(p);if(q){hints--;render();[p,q].forEach(x=>[...board.children].find(e=>+e.dataset.r===x.r&&+e.dataset.c===x.c).classList.add('hint'));status('高亮的是一组可消除麻将');setTimeout(render,1800);return}}status('当前没有相邻可消除对子')};$('shuffle').onclick=()=>{let cards=grid.flat().filter(Boolean).sort(()=>Math.random()-.5),i=0;grid=grid.map(row=>row.map(x=>x?cards[i++]:null));selected=null;render();status('牌面已洗乱')};$('bomb').onclick=()=>{if(!bombs)return;let cards=[];grid.forEach((row,r)=>row.forEach((x,c)=>x&&cards.push({r,c})));cards.sort(()=>Math.random()-.5).slice(0,2).forEach(p=>grid[p.r][p.c]=null);bombs--;render();status('炸弹移除了两张麻将')};$('restart').onclick=fresh;fresh();
</script></body></html>
