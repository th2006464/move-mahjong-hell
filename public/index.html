<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>挪对对 · 地狱模式</title><style>
:root{--sky:#a9ddef;--wood:#9d6743;--green:#3ac777;--ink:#215b54}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ff9c62 0 15%,var(--sky) 15%);font-family:"PingFang SC",Arial,sans-serif;color:var(--ink);user-select:none;-webkit-text-size-adjust:100%}.app{height:100dvh;max-width:620px;margin:auto;padding:10px 8px;display:flex;flex-direction:column}.hud{height:66px;display:flex;align-items:center;gap:12px}.pause{width:59px;height:59px;border:5px solid #f4d72c;border-radius:50%;background:#44cb7d;box-shadow:inset 0 0 0 5px #ed6335,0 3px #885338;color:#fff;font-size:27px}.meters{flex:1}.meter{height:22px;margin:4px 0;padding-left:8px;line-height:16px;border:3px solid #914d34;border-radius:18px;background:#bd6b43;overflow:hidden;color:#fff;font-weight:900}.meter:before{content:"";display:block;width:53%;height:100%;margin:-16px 0 0 -8px;background:#f4c544}.coins:before{width:70%;background:#e6e5b7}.meter b{position:relative;top:-17px}.more{padding:7px 13px;border:0;border-radius:18px;background:#fff1db;color:#5d4c45;font-size:28px}.title{margin:4px 0 2px;text-align:center;color:#fff6e3;font-size:24px;line-height:1;text-shadow:2px 3px #825139}.status{height:24px;text-align:center;font-size:14px;font-weight:800}.board{--tile:min(calc((100vw - 32px)/20),calc((100dvh - 134px)/24));display:grid;grid-template-columns:repeat(20,var(--tile));grid-template-rows:repeat(24,var(--tile));gap:1px;align-self:center;padding:6px;border:6px solid var(--wood);border-radius:15px;background:var(--green);box-shadow:0 4px #6f9f98;touch-action:none}.tile{width:var(--tile);height:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #acc7ae;border-radius:3px;background:linear-gradient(145deg,#fffef4,#e9eddd);box-shadow:1px 2px #8ba98f,inset 0 0 0 1px #fff;font-weight:900;line-height:.7;transition:transform .1s}.empty{border:0;background:transparent;box-shadow:none}.selected{z-index:2;outline:3px solid #ffe037;box-shadow:0 0 0 2px #fff4a8,1px 2px #8ba98f;transform:scale(1.09)}.glyph{font-family:"Noto Sans Symbols 2","Segoe UI Symbol","Arial Unicode MS",sans-serif;font-size:calc(var(--tile)*.76);font-weight:700;line-height:1}.man{color:#d04436}.bam{color:#2b8b5f}.dot{color:#3779a8}.wind{color:#296c60}.dragon{color:#d2433b}.fly{position:fixed;z-index:20;pointer-events:none;transition:transform .18s ease-out}.hint{z-index:3;animation:hint .42s alternate 5}@keyframes hint{to{background:#ffe85b;transform:scale(1.13)}}body:has(.hint) .tile:not(.hint){filter:brightness(.32)}.legend{height:23px;margin-top:4px;text-align:center;font-size:12px}.tools{display:flex;justify-content:center;gap:8px;margin-top:4px}.tool{border:3px solid #22509a;border-radius:13px;background:linear-gradient(#75aaf6,#477ed8);box-shadow:0 3px #244676;padding:7px 11px;color:#fff;font-size:15px;font-weight:900}@media(max-height:700px){.app{padding-top:6px}.hud{height:57px}.pause{width:51px;height:51px}.board{--tile:min(calc((100vw - 32px)/20),calc((100dvh - 129px)/24))}.tool{padding:5px 8px}}
.game-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.game-head .title{grid-column:2}.icon-btn{width:38px;height:34px;border:2px solid #8c5737;border-radius:11px;background:#fff1dc;color:#704a37;font-size:20px;font-weight:900}.stats{height:24px;display:flex;align-items:center;justify-content:center;gap:22px;font-size:14px;font-weight:900}.stats button{border:0;background:transparent;color:#174f81;font:inherit}.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:#173f4299}.modal-wrap.hidden{display:none}.panel{width:min(92vw,390px);max-height:85dvh;overflow:auto;padding:22px;border:4px solid var(--wood);border-radius:20px;background:#fffbea;box-shadow:0 7px #67452f;text-align:center}.panel h2{margin:0 0 15px}.panel input{width:100%;height:42px;margin-bottom:12px;padding:8px 12px;border:2px solid #8db39c;border-radius:10px;font-size:16px}.menu-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu-actions button,.close-btn{padding:11px 8px;border:0;border-radius:11px;background:#4d86df;color:#fff;font-size:16px;font-weight:900}.menu-actions .danger{background:#d85b50}.close-btn{width:100%;margin-top:12px;background:#8b9b9a}.ranking{width:100%;border-collapse:collapse;font-size:14px}.ranking th,.ranking td{padding:7px 4px;border-bottom:1px solid #d9d8c4}.ranking th{color:#7a5a35}.result-summary{margin:0 0 14px;font-size:18px;font-weight:900}html,body,button{touch-action:manipulation}button{-webkit-tap-highlight-color:transparent}.board{touch-action:none}
</style></head><body><main class="app"><div class="game-head"><span></span><h1 class="title">挪对对 · 地狱模式</h1><button class="icon-btn" id="settings" aria-label="设置">⚙</button></div><div class="stats"><span>得分 <b id="score">0</b></span><span>本局 <b id="clock">00:00</b></span><button id="rankOpen">排行榜</button></div><div class="status" id="status">点击相邻同牌，或拖动麻将进入空位</div><div class="board" id="board"></div><div class="legend">只能横向 / 纵向挪动 · 路径必须全为空位</div><div class="tools"><button class="tool" id="hint">💡 提示 <span>3</span></button><button class="tool" id="shuffle">🔀 洗牌</button><button class="tool" id="bomb">💣 炸弹 <span>1</span></button><button class="tool" id="restart">↻ 重开</button></div></main><div class="modal-wrap hidden" id="settingsModal"><section class="panel"><h2>游戏设置</h2><input id="playerName" maxlength="16" placeholder="玩家昵称"><div class="menu-actions"><button id="saveGame">保存进度</button><button id="loadGame">加载进度</button><button id="showRank">排行榜</button><button class="danger" id="endGame">结束游戏</button></div><button class="close-btn" data-close="settingsModal">返回游戏</button></section></div><div class="modal-wrap hidden" id="rankModal"><section class="panel"><h2 id="rankTitle">排行榜</h2><p class="result-summary hidden" id="resultSummary"></p><table class="ranking"><thead><tr><th>排名</th><th>玩家</th><th>分数</th><th>用时</th></tr></thead><tbody id="rankBody"></tbody></table><button class="close-btn" data-close="rankModal">关闭</button></section></div><script>
const ROWS=24,COLS=20,GLYPHS=["🀇︎","🀈︎","🀉︎","🀊︎","🀋︎","🀌︎","🀍︎","🀎︎","🀏︎","🀐︎","🀑︎","🀒︎","🀓︎","🀔︎","🀕︎","🀖︎","🀗︎","🀘︎","🀙︎","🀚︎","🀛︎","🀜︎","🀝︎","🀞︎","🀟︎","🀠︎","🀡︎","🀀︎","🀁︎","🀂︎","🀃︎","🀄︎","🀅︎","🀆︎"],TYPES=GLYPHS.map((glyph,i)=>({id:"t"+i,glyph,kind:i<9?"man":i<18?"bam":i<27?"dot":i<31?"wind":"dragon"}));const $=id=>document.getElementById(id);const clientId=localStorage.getItem('mahjong-client-id')||crypto.randomUUID(),typeMap=new Map(TYPES.map(x=>[x.id,x]));localStorage.setItem('mahjong-client-id',clientId);let grid=[],selected=null,score=0,hints=3,bombs=1,paused=false,drag=null,animating=false,startedAt=Date.now(),elapsedBase=0,ended=false;
function status(t){$('status').textContent=t}
function inside(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS}
function same(a,b){return a&&b&&a.id===b.id}
function elapsed(){return elapsedBase+(ended?0:Math.floor((Date.now()-startedAt)/1000))}
function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function fresh(){let cards=[];for(let i=0;i<ROWS*COLS/2;i++)cards.push(TYPES[i%TYPES.length],TYPES[i%TYPES.length]);cards.sort(()=>Math.random()-.5);grid=Array.from({length:ROWS},(_,r)=>cards.slice(r*COLS,(r+1)*COLS));selected=null;score=0;hints=3;bombs=1;elapsedBase=0;startedAt=Date.now();ended=false;paused=false;render();status('点击相邻同牌，或拖动麻将进入空位')}
function render(){let b=$('board');b.replaceChildren();grid.forEach((row,r)=>row.forEach((card,c)=>{let e=document.createElement('div');e.className=card?`tile ${card.kind}`:'tile empty';e.dataset.r=r;e.dataset.c=c;if(card){e.innerHTML=`<span class="glyph">${card.glyph}</span>`;if(selected?.r===r&&selected?.c===c)e.classList.add('selected')}b.append(e)}));$('score').textContent=score;$('hint').innerHTML=`💡 提示 <span>${hints}</span>`;$('bomb').innerHTML=`💣 炸弹 <span>${bombs}</span>`}
function clear(a,b){if(a.r===b.r){for(let c=Math.min(a.c,b.c)+1;c<Math.max(a.c,b.c);c++)if(grid[a.r][c])return false;return true}if(a.c===b.c){for(let r=Math.min(a.r,b.r)+1;r<Math.max(a.r,b.r);r++)if(grid[r][a.c])return false;return true}return false}
function near(p){let card=grid[p.r][p.c];return [[-1,0],[1,0],[0,-1],[0,1]].map(([dr,dc])=>({r:p.r+dr,c:p.c+dc})).find(q=>inside(q.r,q.c)&&same(card,grid[q.r][q.c]))}
function remove(a,b,msg){grid[a.r][a.c]=null;grid[b.r][b.c]=null;score+=1;selected=null;render();status(msg)}
function tap(p){
  if(paused||animating)return;
  const card=grid[p.r][p.c];
  if(!card){
    if(!selected){status('请先点击一张麻将');return}
    if(selected.r!==p.r&&selected.c!==p.c){status('只能点击同一行或列的空位');return}
    moveGroup(selected,p);
    return;
  }
  const pair=near(p);
  if(pair){remove(p,pair,'相邻配对成功！');return}
  selected=p;render();status('黄框已选中：点击同一行或列的空位')
}
function aligned(p){let card=grid[p.r][p.c];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let q={r,c};if((r!==p.r||c!==p.c)&&same(card,grid[r][c])&&clear(p,q))return q}return null}
function animateMove(fromPos,toPos){
  const card=grid[fromPos.r][fromPos.c];
  const source=[...board.children].find(e=>+e.dataset.r===fromPos.r&&+e.dataset.c===fromPos.c);
  const from=source.getBoundingClientRect();
  grid[fromPos.r][fromPos.c]=null;
  grid[toPos.r][toPos.c]=card;
  selected=null;render();
  const target=[...board.children].find(e=>+e.dataset.r===toPos.r&&+e.dataset.c===toPos.c);
  const to=target.getBoundingClientRect();
  target.style.transition='none';
  target.style.transform=`translate(${from.left-to.left}px,${from.top-to.top}px)`;
  target.style.zIndex='20';
  animating=true;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    target.style.transition='transform .18s ease-out';
    target.style.transform='translate(0,0)';
  }));
  setTimeout(()=>{animating=false;const pair=aligned(toPos);if(pair)remove(toPos,pair,'对齐成功，自动消除！');else{render();status('已挪动，继续寻找同牌')}},210)
}
function moveGroup(fromPos,toPos){
  if(paused||animating||grid[toPos.r][toPos.c])return;
  const dr=toPos.r===fromPos.r?0:(toPos.r>fromPos.r?1:-1);
  const dc=toPos.c===fromPos.c?0:(toPos.c>fromPos.c?1:-1);
  if(!dr&&!dc)return;
  const sources=[];
  let r=fromPos.r,c=fromPos.c;
  while(inside(r,c)&&grid[r][c]){sources.push({r,c,card:grid[r][c]});r+=dr;c+=dc}
  const end=sources[sources.length-1];
  const distance=dr?(toPos.r-end.r)*dr:(toPos.c-end.c)*dc;
  if(distance<1){status('目标空位必须位于选中方向的牌组外侧');return}
  for(let step=1;step<=distance;step++){
    const rr=end.r+dr*step,cc=end.c+dc*step;
    if(!inside(rr,cc)||grid[rr][cc]){status('牌组和目标位置之间必须全部为空');return}
  }
  const starts=sources.map(s=>[...board.children].find(e=>+e.dataset.r===s.r&&+e.dataset.c===s.c).getBoundingClientRect());
  sources.forEach(s=>grid[s.r][s.c]=null);
  const destinations=sources.map(s=>({r:s.r+dr*distance,c:s.c+dc*distance,card:s.card}));
  destinations.forEach(d=>grid[d.r][d.c]=d.card);
  selected=null;render();animating=true;
  destinations.forEach((d,i)=>{
    const tile=[...board.children].find(e=>+e.dataset.r===d.r&&+e.dataset.c===d.c),to=tile.getBoundingClientRect(),from=starts[i];
    tile.style.transition='none';tile.style.transform=`translate(${from.left-to.left}px,${from.top-to.top}px)`;tile.style.zIndex='20';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{tile.style.transition='transform .2s ease-out';tile.style.transform='translate(0,0)'}));
  });
  setTimeout(()=>{
    animating=false;const used=new Set();let removed=0;
    destinations.forEach(d=>{const key=`${d.r},${d.c}`;if(used.has(key)||!grid[d.r][d.c])return;const pair=aligned(d);if(pair){grid[d.r][d.c]=null;grid[pair.r][pair.c]=null;used.add(key);used.add(`${pair.r},${pair.c}`);score+=1;removed++}});
    render();status(removed?`整体移动并消除 ${removed} 对！`:`已整体移动 ${sources.length} 张麻将`)
  },230)
}
function move(p,dr,dc,steps=1){
  if(paused||animating)return;
  let r=p.r+dr,c=p.c+dc,last=null;
  let moved=0;
  while(moved<steps&&inside(r,c)&&!grid[r][c]){last={r,c};r+=dr;c+=dc;moved++}
  if(!last){status('这个方向没有连续空位');return}
  animateMove(p,last)
}

let board=$('board');board.addEventListener('pointerdown',e=>{let el=e.target.closest('.tile');if(!el)return;drag={p:{r:+el.dataset.r,c:+el.dataset.c},x:e.clientX,y:e.clientY};board.setPointerCapture?.(e.pointerId)});board.addEventListener('pointerup',e=>{if(!drag)return;let d=drag,dx=e.clientX-d.x,dy=e.clientY-d.y;drag=null;if(Math.max(Math.abs(dx),Math.abs(dy))<8){tap(d.p);return}if(!grid[d.p.r][d.p.c])return;const cell=board.querySelector('.tile').getBoundingClientRect();if(Math.abs(dx)>Math.abs(dy)){const steps=Math.max(1,Math.round(Math.abs(dx)/(cell.width+1)));move(d.p,0,dx>0?1:-1,steps)}else{const steps=Math.max(1,Math.round(Math.abs(dy)/(cell.height+1)));move(d.p,dy>0?1:-1,0,steps)}});board.addEventListener('pointercancel',()=>drag=null);
$('hint').onclick=()=>{if(!hints)return;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let p={r,c},q=grid[r][c]&&near(p);if(q){hints--;render();[p,q].forEach(x=>[...board.children].find(e=>+e.dataset.r===x.r&&+e.dataset.c===x.c).classList.add('hint'));status('高亮的是一组可消除麻将');setTimeout(render,1800);return}}status('当前没有相邻可消除对子')};$('shuffle').onclick=()=>{let cards=grid.flat().filter(Boolean).sort(()=>Math.random()-.5),i=0;grid=grid.map(row=>row.map(x=>x?cards[i++]:null));selected=null;render();status('牌面已洗乱')};$('bomb').onclick=()=>{if(!bombs)return;let cards=[];grid.forEach((row,r)=>row.forEach((x,c)=>x&&cards.push({r,c})));cards.sort(()=>Math.random()-.5).slice(0,2).forEach(p=>grid[p.r][p.c]=null);bombs--;render();status('炸弹移除了两张麻将')};$('restart').onclick=fresh;

function playerName(){return ($('playerName').value.trim()||'匿名玩家').slice(0,16)}
function snapshot(){return {grid:grid.map(row=>row.map(card=>card?.id||null)),hints,bombs}}
function applySave(data){
  const state=typeof data.gameState==='string'?JSON.parse(data.gameState):data.gameState;
  if(!Array.isArray(state?.grid)||state.grid.length!==ROWS)throw new Error('存档格式错误');
  const restored=state.grid.map(row=>row.map(id=>id===null?null:typeMap.get(id))).filter(row=>row.length===COLS);
  if(restored.length!==ROWS||restored.some(row=>row.some(card=>card===undefined)))throw new Error('存档牌面错误');
  grid=restored;score=Number(data.score)||0;elapsedBase=Number(data.elapsedSeconds)||0;hints=Number(state.hints??3);bombs=Number(state.bombs??1);startedAt=Date.now();ended=false;paused=false;selected=null;render();status('进度已加载')
}
async function saveGame(){
  const payload={clientId,playerName:playerName(),gameState:snapshot(),score,elapsedSeconds:elapsed()};
  localStorage.setItem('mahjong-save',JSON.stringify(payload));localStorage.setItem('mahjong-player-name',payload.playerName);
  try{const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error();status('进度已保存到云端')}catch{status('网络不可用，进度已保存在本机')}
  $('settingsModal').classList.add('hidden')
}
async function loadGame(){
  try{const response=await fetch(`/api/save?clientId=${encodeURIComponent(clientId)}`),data=await response.json();if(!data.save)throw new Error('云端没有存档');applySave(data.save)}catch(error){const local=localStorage.getItem('mahjong-save');if(!local){status(error.message||'没有找到存档');return}applySave(JSON.parse(local))}
  $('settingsModal').classList.add('hidden')
}
async function showLeaderboard(isResult=false){
  $('settingsModal').classList.add('hidden');$('rankModal').classList.remove('hidden');$('rankTitle').textContent=isResult?'本局结束':'排行榜';$('resultSummary').classList.toggle('hidden',!isResult);$('rankBody').innerHTML='<tr><td colspan="4">加载中…</td></tr>';
  try{const response=await fetch('/api/leaderboard'),data=await response.json();$('rankBody').innerHTML=data.entries.length?data.entries.map((entry,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(entry.playerName)}</td><td>${entry.score}</td><td>${formatTime(entry.durationSeconds)}</td></tr>`).join(''):'<tr><td colspan="4">还没有成绩</td></tr>'}catch{$('rankBody').innerHTML='<tr><td colspan="4">排行榜加载失败</td></tr>'}
}
function escapeHtml(value){const el=document.createElement('span');el.textContent=value;return el.innerHTML}
async function endGame(){
  const duration=elapsed();ended=true;elapsedBase=duration;paused=true;localStorage.setItem('mahjong-player-name',playerName());$('resultSummary').textContent=`${playerName()} · ${score} 分 · ${formatTime(duration)}`;$('settingsModal').classList.add('hidden');
  try{await fetch('/api/end',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId,playerName:playerName(),score,durationSeconds:duration})})}catch{}
  await showLeaderboard(true)
}
$('playerName').value=localStorage.getItem('mahjong-player-name')||`玩家${clientId.slice(0,4)}`;
$('settings').onclick=()=>$('settingsModal').classList.remove('hidden');$('rankOpen').onclick=()=>$('rankModal').classList.remove('hidden')||showLeaderboard();$('showRank').onclick=()=>showLeaderboard();$('saveGame').onclick=saveGame;$('loadGame').onclick=loadGame;$('endGame').onclick=endGame;document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).classList.add('hidden'));
setInterval(()=>{$('clock').textContent=formatTime(elapsed())},500);
document.addEventListener('dblclick',event=>event.preventDefault(),{passive:false});document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
fresh();
</script></body></html>
