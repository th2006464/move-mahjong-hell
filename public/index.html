const ROWS=24,COLS=20,GLYPHS=["🀇︎","🀈︎","🀉︎","🀊︎","🀋︎","🀌︎","🀍︎","🀎︎","🀏︎","🀐︎","🀑︎","🀒︎","🀓︎","🀔︎","🀕︎","🀖︎","🀗︎","🀘︎","🀙︎","🀚︎","🀛︎","🀜︎","🀝︎","🀞︎","🀟︎","🀠︎","🀡︎","🀄︎","🀅︎","🀆︎"],TYPES=GLYPHS.map((glyph,i)=>({id:"t"+i,glyph,kind:i<9?"man":i<18?"bam":i<27?"dot":i===27?"dragon-red":i===28?"dragon-green":"dragon-white"})),LEGACY_ID_MAP={t27:"t29",t28:"t28",t29:"t27",t30:"t29",t31:"t27",t32:"t28",t33:"t29"};const $=id=>document.getElementById(id);const clientId=localStorage.getItem('mahjong-client-id')||crypto.randomUUID(),typeMap=new Map(TYPES.map(x=>[x.id,x]));localStorage.setItem('mahjong-client-id',clientId);let grid=[],selected=null,score=0,hints=3,bombs=1,paused=false,drag=null,animating=false,startedAt=Date.now(),elapsedBase=0,ended=false;
const bgMusic=$('bgMusic'),matchSound=$('matchSound');bgMusic.volume=.28;matchSound.volume=.8;
const saveModal=document.createElement('div');saveModal.id='saveListModal';saveModal.className='modal-wrap hidden';saveModal.innerHTML='<section class="panel"><h2>选择存档</h2><div class="save-list" id="saveList"></div><button class="close-btn" data-close="saveListModal">返回</button></section>';document.body.append(saveModal);
const pauseModal=document.createElement('div');pauseModal.id='pauseModal';pauseModal.className='modal-wrap hidden';pauseModal.innerHTML='<section class="panel pause-panel"><h2>游戏已暂停</h2><p>本局计时已停止</p><button class="close-btn" id="resumeGame">▶ 继续游戏</button></section>';document.body.append(pauseModal);
function startMusic(){if(bgMusic.paused)bgMusic.play().catch(()=>{})}
function playMatchSound(){matchSound.currentTime=0;matchSound.play().catch(()=>{})}
function pauseGame(){if(paused||ended||animating)return;elapsedBase=elapsed();paused=true;bgMusic.pause();$('pauseModal').classList.remove('hidden');status('游戏已暂停')}

function status(t){$('status').textContent=t}
function inside(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS}
function same(a,b){return a&&b&&a.id===b.id}
function elapsed(){return elapsedBase+((ended||paused)?0:Math.floor((Date.now()-startedAt)/1000))}
function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function fresh(){let cards=[];for(let i=0;i<ROWS*COLS/2;i++)cards.push(TYPES[i%TYPES.length],TYPES[i%TYPES.length]);cards.sort(()=>Math.random()-.5);grid=Array.from({length:ROWS},(_,r)=>cards.slice(r*COLS,(r+1)*COLS));selected=null;score=0;hints=3;bombs=1;elapsedBase=0;startedAt=Date.now();ended=false;paused=false;render();status('点击相邻同牌，或拖动麻将进入空位')}
function render(){let b=$('board');b.replaceChildren();grid.forEach((row,r)=>row.forEach((card,c)=>{let e=document.createElement('div');e.className=card?`tile ${card.kind}`:'tile empty';e.dataset.r=r;e.dataset.c=c;if(card){e.innerHTML=`<span class="glyph">${card.glyph}</span>`;if(selected?.r===r&&selected?.c===c)e.classList.add('selected')}b.append(e)}));$('score').textContent=score;$('hint').innerHTML=`💡 提示 <span>${hints}</span>`;$('bomb').innerHTML='⏸ 暂停'}
function clear(a,b){if(a.r===b.r){for(let c=Math.min(a.c,b.c)+1;c<Math.max(a.c,b.c);c++)if(grid[a.r][c])return false;return true}if(a.c===b.c){for(let r=Math.min(a.r,b.r)+1;r<Math.max(a.r,b.r);r++)if(grid[r][a.c])return false;return true}return false}
function near(p){let card=grid[p.r][p.c];return [[-1,0],[1,0],[0,-1],[0,1]].map(([dr,dc])=>({r:p.r+dr,c:p.c+dc})).find(q=>inside(q.r,q.c)&&same(card,grid[q.r][q.c]))}
function remove(a,b,msg){grid[a.r][a.c]=null;grid[b.r][b.c]=null;score+=1;selected=null;playMatchSound();render();status(msg)}
function tap(p){
  if(paused||animating)return;
  const card=grid[p.r][p.c];
  if(!card){
    if(!selected){status('请先点击一张麻将');return}
    if(selected.r!==p.r&&selected.c!==p.c){status('只能点击同一行或列的空位');return}
    moveGroup(selected,p);
    return;
  }
  const pair=aligned(p);
  if(pair){remove(p,pair,'同线无遮挡，配对成功！');return}
  selected=p;render();status('已选择麻将：点击同一行或列的空位')
}
function aligned(p){let card=grid[p.r][p.c];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let q={r,c};if((r!==p.r||c!==p.c)&&same(card,grid[r][c])&&clear(p,q))return q}return null}
function animateMove(fromPos,toPos){
  const card=grid[fromPos.r][fromPos.c];
  const source=[...board.children].find(e=>+e.dataset.r===fromPos.r&&+e.dataset.c===fromPos.c);
  const from=source.getBoundingClientRect();
  grid[fromPos.r][fromPos.c]=null;
  grid[toPos.r][toPos.c]=card;
  if(!aligned(toPos)){
    grid[toPos.r][toPos.c]=null;grid[fromPos.r][fromPos.c]=card;selected=null;animating=true;
    source.style.transition='transform .18s ease-out';source.style.transform='translate(0,0)';
    setTimeout(()=>{animating=false;render();status('未形成配对，麻将已返回原位')},190);return
  }
  selected=null;render();
  const target=[...board.children].find(e=>+e.dataset.r===toPos.r&&+e.dataset.c===toPos.c);
  const to=target.getBoundingClientRect();
  target.style.transition='none';
  target.style.transform=`translate(${from.left-to.left}px,${from.top-to.top}px)`;
  target.style.zIndex='20';
  animating=true;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    target.style.transition='transform .18s ease-out';
    target.style.transform='translate(0,0)';
  }));
  setTimeout(()=>{animating=false;const pair=aligned(toPos);if(pair)remove(toPos,pair,'对齐成功，自动消除！');else{render();status('已挪动，继续寻找同牌')}},210)

function moveGroup(fromPos,toPos){
  if(paused||animating||grid[toPos.r][toPos.c])return;
  const dr=toPos.r===fromPos.r?0:(toPos.r>fromPos.r?1:-1);
  const dc=toPos.c===fromPos.c?0:(toPos.c>fromPos.c?1:-1);
  if(!dr&&!dc)return;
  const sources=[];
  let r=fromPos.r,c=fromPos.c;
  while(inside(r,c)&&grid[r][c]){sources.push({r,c,card:grid[r][c]});r+=dr;c+=dc}
  const end=sources[sources.length-1];
  const distance=dr?(toPos.r-end.r)*dr:(toPos.c-end.c)*dc;
  if(distance<1){status('目标空位必须位于选中方向的牌组外侧');return}
  for(let step=1;step<=distance;step++){
    const rr=end.r+dr*step,cc=end.c+dc*step;
    if(!inside(rr,cc)||grid[rr][cc]){status('牌组和目标位置之间必须全部为空');return}
  }
  const sourceTiles=sources.map(s=>[...board.children].find(e=>+e.dataset.r===s.r&&+e.dataset.c===s.c));

  destinations.forEach(d=>grid[d.r][d.c]=d.card);
  if(!destinations.some(d=>aligned(d))){
    destinations.forEach(d=>grid[d.r][d.c]=null);sources.forEach(s=>grid[s.r][s.c]=s.card);selected=null;animating=true;
    sourceTiles.forEach(tile=>{tile.style.transition='transform .18s ease-out';tile.style.transform='translate(0,0)'});
    setTimeout(()=>{animating=false;render();status('未形成配对，牌组已返回原位')},190);return
  }
  selected=null;render();animating=true;
  destinations.forEach((d,i)=>{
    const tile=[...board.children].find(e=>+e.dataset.r===d.r&&+e.dataset.c===d.c),to=tile.getBoundingClientRect(),from=starts[i];
    tile.style.transition='none';tile.style.transform=`translate(${from.left-to.left}px,${from.top-to.top}px)`;tile.style.zIndex='20';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{tile.style.transition='transform .2s ease-out';tile.style.transform='translate(0,0)'}));
  });
  setTimeout(()=>{
    animating=false;const used=new Set();let removed=0;
    destinations.forEach(d=>{const key=`${d.r},${d.c}`;if(used.has(key)||!grid[d.r][d.c])return;const pair=aligned(d);if(pair){grid[d.r][d.c]=null;grid[pair.r][pair.c]=null;used.add(key);used.add(`${pair.r},${pair.c}`);score+=1;removed++}});

function move(p,dr,dc,steps=1){
  if(paused||animating)return;
  let r=p.r+dr,c=p.c+dc,last=null;
  let moved=0;
  while(moved<steps&&inside(r,c)&&!grid[r][c]){last={r,c};r+=dr;c+=dc;moved++}

  animateMove(p,last)
}

let board=$('board');
function pushInfo(p,dr,dc){
  const sources=[];let r=p.r,c=p.c;
  while(inside(r,c)&&grid[r][c]){sources.push({r,c});r+=dr;c+=dc}
  let emptyCount=0;while(inside(r,c)&&!grid[r][c]){emptyCount++;r+=dr;c+=dc}
  return {sources,emptyCount,end:sources[sources.length-1]}
}
function resetDraggedTiles(item){(item?.els||[item?.el]).filter(Boolean).forEach(el=>{el.style.transition='';el.style.transform='';el.style.zIndex=''})}
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.tile');if(!el||animating)return;
  drag={p:{r:+el.dataset.r,c:+el.dataset.c},x:e.clientX,y:e.clientY,el,els:[el],axis:null,visualDistance:0};
  board.setPointerCapture?.(e.pointerId)

board.addEventListener('pointermove',e=>{
  if(!drag||!grid[drag.p.r][drag.p.c])return;

  if(!drag.axis&&Math.max(Math.abs(dx),Math.abs(dy))>5)drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(!drag.axis)return;e.preventDefault();
  const cell=board.querySelector('.tile').getBoundingClientRect();
  const delta=drag.axis==='x'?dx:dy,dr=drag.axis==='y'?(delta>0?1:-1):0,dc=drag.axis==='x'?(delta>0?1:-1):0;
  const info=pushInfo(drag.p,dr,dc),unit=drag.axis==='x'?cell.width:cell.height,maxDistance=info.emptyCount*unit;
  drag.visualDistance=Math.sign(delta)*Math.min(Math.abs(delta),maxDistance);
  resetDraggedTiles(drag);drag.els=info.sources.map(p=>[...board.children].find(el=>+el.dataset.r===p.r&&+el.dataset.c===p.c)).filter(Boolean);
  drag.els.forEach(el=>{el.style.transition='none';el.style.zIndex='30';el.style.transform=drag.axis==='x'?`translateX(${drag.visualDistance}px)`:`translateY(${drag.visualDistance}px)`})
},{passive:false});
board.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;

  if(!d.axis||Math.max(Math.abs(dx),Math.abs(dy))<8){resetDraggedTiles(d);tap(d.p);return}
  const cell=board.querySelector('.tile').getBoundingClientRect(),delta=d.axis==='x'?dx:dy;

});
board.addEventListener('pointercancel',()=>{resetDraggedTiles(drag);drag=null});
board.addEventListener('touchmove',event=>event.preventDefault(),{passive:false});
$('hint').onclick=()=>{if(!hints)return;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let p={r,c},q=grid[r][c]&&aligned(p);if(q){hints--;render();[p,q].forEach(x=>[...board.children].find(e=>+e.dataset.r===x.r&&+e.dataset.c===x.c).classList.add('hint'));status('高亮的是一组同线无遮挡对子');setTimeout(render,1800);return}}status('当前没有可直接消除的对子')};$('shuffle').onclick=()=>{let cards=grid.flat().filter(Boolean).sort(()=>Math.random()-.5),i=0;grid=grid.map(row=>row.map(x=>x?cards[i++]:null));selected=null;render();status('牌面已洗乱')};$('bomb').onclick=pauseGame;$('restart').onclick=fresh;

function playerName(){return ($('playerName').value.trim()||'匿名玩家').slice(0,16)}
function snapshot(){return {grid:grid.map(row=>row.map(card=>card?.id||null)),hints,bombs}}
function applySave(data){
  const state=typeof data.gameState==='string'?JSON.parse(data.gameState):data.gameState;
  if(!Array.isArray(state?.grid)||state.grid.length!==ROWS)throw new Error('存档格式错误');
  const restored=state.grid.map(row=>row.map(id=>id===null?null:typeMap.get(id)||typeMap.get(LEGACY_ID_MAP[id]))).filter(row=>row.length===COLS);
  if(restored.length!==ROWS||restored.some(row=>row.some(card=>card===undefined)))throw new Error('存档牌面错误');
  grid=restored;score=Number(data.score)||0;elapsedBase=Number(data.elapsedSeconds)||0;hints=Number(state.hints??3);bombs=Number(state.bombs??1);startedAt=Date.now();ended=false;paused=false;selected=null;render();status('进度已加载')
}
async function saveGame(){
  const payload={saveId:crypto.randomUUID(),savedAt:new Date().toISOString(),clientId,playerName:playerName(),gameState:snapshot(),score,elapsedSeconds:elapsed()};
  const history=readLocalSaves().filter(item=>item.saveId!==payload.saveId);history.unshift(payload);localStorage.setItem('mahjong-save-history',JSON.stringify(history.slice(0,30)));
  localStorage.setItem('mahjong-save',JSON.stringify(payload));localStorage.setItem('mahjong-player-name',payload.playerName);
  try{const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error();status('进度已保存到云端')}catch{status('网络不可用，进度已保存在本机')}
  $('settingsModal').classList.add('hidden')
}
function readLocalSaves(){try{const saves=JSON.parse(localStorage.getItem('mahjong-save-history')||'[]');return Array.isArray(saves)?saves:[]}catch{return []}}
function saveTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?'旧版存档':new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date)}
async function restoreSave(entry){
  try{
    let data=entry.localData;
    if(entry.source==='cloud'){
      const suffix=entry.id==='latest'?'':`&saveId=${encodeURIComponent(entry.id)}`;
      const response=await fetch(`/api/save?clientId=${encodeURIComponent(clientId)}${suffix}`),result=await response.json();if(!response.ok||!result.save)throw new Error('存档读取失败');data=result.save
    }
    applySave(data);$('saveListModal').classList.add('hidden')
  }catch(error){status(error.message||'存档读取失败')}
}
async function loadGame(){
  $('settingsModal').classList.add('hidden');$('saveListModal').classList.remove('hidden');$('saveList').innerHTML='<p class="save-empty">正在读取存档…</p>';
  const locals=readLocalSaves(),localById=new Map(locals.map(item=>[item.saveId,item]));let entries=[];
  try{const response=await fetch(`/api/saves?clientId=${encodeURIComponent(clientId)}`),data=await response.json();if(!response.ok)throw new Error();entries=(data.saves||[]).map(item=>({...item,source:'cloud',localData:localById.get(item.id)}))}catch{}
  locals.forEach(item=>{if(!entries.some(entry=>entry.id===item.saveId))entries.push({id:item.saveId,savedAt:item.savedAt,score:item.score,elapsedSeconds:item.elapsedSeconds,source:'local',localData:item})});
  if(!entries.length){const legacy=localStorage.getItem('mahjong-save');if(legacy){const data=JSON.parse(legacy);entries.push({id:'local-latest',savedAt:data.savedAt,score:data.score,elapsedSeconds:data.elapsedSeconds,source:'local',localData:data})}}
  entries.sort((a,b)=>new Date(b.savedAt||0)-new Date(a.savedAt||0));const list=$('saveList');list.replaceChildren();
  if(!entries.length){list.innerHTML='<p class="save-empty">还没有保存过进度</p>';return}
  entries.forEach(entry=>{const button=document.createElement('button');button.className='save-entry';const title=document.createElement('strong'),meta=document.createElement('span');title.textContent=saveTime(entry.savedAt);meta.textContent=`${entry.score||0} 分 · 本局 ${formatTime(entry.elapsedSeconds||0)}${entry.source==='local'?' · 本机':''}`;button.append(title,meta);button.onclick=()=>restoreSave(entry);list.append(button)})
}
async function showLeaderboard(isResult=false){
  $('settingsModal').classList.add('hidden');$('rankModal').classList.remove('hidden');$('rankTitle').textContent=isResult?'本局结束':'排行榜';$('resultSummary').classList.toggle('hidden',!isResult);$('rankBody').innerHTML='<tr><td colspan="4">加载中…</td></tr>';
  try{const response=await fetch('/api/leaderboard'),data=await response.json();$('rankBody').innerHTML=data.entries.length?data.entries.map((entry,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(entry.playerName)}<small>${entry.recordType==='completed'?'完成':'存档'} · ${saveTime(entry.recordedAt)}</small></td><td>${entry.score}</td><td>${formatTime(entry.durationSeconds)}</td></tr>`).join(''):'<tr><td colspan="4">还没有记录</td></tr>'}catch{$('rankBody').innerHTML='<tr><td colspan="4">排行榜加载失败</td></tr>'}
}
function escapeHtml(value){const el=document.createElement('span');el.textContent=value;return el.innerHTML}
async function endGame(){
  const duration=elapsed();ended=true;elapsedBase=duration;paused=true;localStorage.setItem('mahjong-player-name',playerName());$('resultSummary').textContent=`${playerName()} · ${score} 分 · ${formatTime(duration)}`;$('settingsModal').classList.add('hidden');
  try{await fetch('/api/end',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId,playerName:playerName(),score,durationSeconds:duration})})}catch{}
  await showLeaderboard(true)
}
$('playerName').value=localStorage.getItem('mahjong-player-name')||`玩家${clientId.slice(0,4)}`;
$('settings').onclick=()=>$('settingsModal').classList.remove('hidden');$('rankOpen').onclick=()=>$('rankModal').classList.remove('hidden')||showLeaderboard();$('showRank').onclick=()=>showLeaderboard();$('saveGame').onclick=saveGame;$('loadGame').onclick=loadGame;$('endGame').onclick=endGame;document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).classList.add('hidden'));
$('resumeGame').onclick=resumeGame;
setInterval(()=>{$('clock').textContent=formatTime(elapsed())},500);
document.addEventListener('dblclick',event=>event.preventDefault(),{passive:false});document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});document.addEventListener('selectstart',event=>event.preventDefault(),{passive:false});document.addEventListener('dragstart',event=>event.preventDefault(),{passive:false});document.addEventListener('contextmenu',event=>{if(event.target.closest?.('.app'))event.preventDefault()},{passive:false});
window.addEventListener('load',startMusic,{once:true});document.addEventListener('pointerdown',startMusic,{once:true});document.addEventListener('keydown',startMusic,{once:true});
fresh();
</script></body></html>
