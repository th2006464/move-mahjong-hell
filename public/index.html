<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>挪对对 · 地狱模式</title><style>
:root{--sky:#a8dbef;--orange:#ff9b62;--brown:#98623c;--green:#42c77b;--ink:#174b48;--cream:#f7f5dc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ff9c62 0 15%,var(--sky) 15%);font-family:Arial,"PingFang SC",sans-serif;color:var(--ink);user-select:none;overflow:hidden}.app{height:100dvh;max-width:620px;margin:auto;padding:12px 10px 10px;display:flex;flex-direction:column}.hud{height:68px;display:flex;align-items:center;gap:10px}.pause{width:62px;height:62px;border-radius:50%;border:5px solid #f7d624;background:#4bd080;color:white;font-size:28px;box-shadow:inset 0 0 0 5px #ed5c2c,0 3px #9a613c}.meters{flex:1}.meter{height:22px;margin:4px 0;border-radius:20px;background:#bd693f;border:3px solid #974f35;overflow:hidden;color:#fff;font-weight:bold;padding-left:8px;line-height:16px}.meter b{position:relative;z-index:1}.meter i{display:block;height:100%;margin-top:-19px;background:#f2bd44;width:52%}.meter.coins i{width:70%;background:#e7e2b0}.more{font-size:28px;background:#fff3dd;border:0;border-radius:18px;padding:8px 12px;color:#55463f}.title{text-align:center;font-weight:900;color:#fff2d9;text-shadow:2px 3px #8a5536;font-size:23px;margin:0 0 6px}.board{--s:min(calc((100vw - 38px)/20),calc((100dvh - 186px)/24),40px);display:grid;grid-template-columns:repeat(20,var(--s));grid-template-rows:repeat(24,var(--s));gap:1px;align-self:center;padding:6px;background:#41bd72;border:6px solid var(--brown);border-radius:14px;box-shadow:0 4px #6c9e9a;touch-action:none}.cell{width:var(--s);height:var(--s);display:grid;place-items:center;background:#f8f7e6;border:1px solid #d3d9c1;border-radius:3px;font-size:calc(var(--s)*.64);font-weight:900;line-height:1;box-shadow:1px 1px #a4b9a5;transition:transform .12s}.cell.empty{background:transparent;border:0;box-shadow:none}.cell.selected{outline:3px solid #ffd62d;transform:scale(1.08);z-index:2}.cell.hint{animation:blink .45s alternate 5}@keyframes blink{to{background:#ffe75c}}.status{text-align:center;height:24px;font-weight:bold;font-size:14px}.tools{display:flex;gap:8px;justify-content:center;margin-top:10px}.tool{background:#538fe7;color:#fff;border:3px solid #204f9e;border-radius:13px;padding:8px 11px;font-weight:bold;font-size:14px;box-shadow:0 3px #23477c}.tool:active{transform:translateY(2px);box-shadow:none}.tool:disabled{opacity:.5}.modal{position:fixed;inset:0;background:#15494299;display:grid;place-items:center;padding:25px}.card{background:var(--cream);border:5px solid var(--brown);border-radius:22px;padding:24px;text-align:center;max-width:380px;box-shadow:0 7px #70442e}.card h1{margin:0 0 10px;color:#d64d35}.card p{line-height:1.7}.start{background:#f6c74d;border:0;border-bottom:5px solid #bd812c;border-radius:14px;padding:12px 28px;font-size:20px;font-weight:bold;color:#5e452b}.hide{display:none}.legend{font-size:12px;text-align:center;margin-top:5px;color:#245e59}@media(max-height:700px){.hud{height:57px}.pause{width:52px;height:52px}.board{--s:min(calc((100vw - 38px)/20),calc((100dvh - 160px)/24),36px)}.tools{margin-top:5px}.tool{padding:6px 8px}}
</style></head><body><main class="app"><div class="hud"><button class="pause" id="pause">Ⅱ</button><div class="meters"><div class="meter"><b>★ <span id="score">0</span></b><i></i></div><div class="meter coins"><b>🪙 <span id="coins">44266</span></b><i></i></div></div><button class="more" id="menu">•••</button></div><h1 class="title">挪对对 · 地狱模式</h1><div class="status" id="status">选择一张牌，再选择目标位置</div><div class="board" id="board"></div><div class="legend">只能横向 / 纵向挪动 · 路径必须全为空位</div><div class="tools"><button class="tool" id="hint">💡 提示 <span>3</span></button><button class="tool" id="shuffle">🔀 洗牌</button><button class="tool" id="bomb">💣 炸弹</button><button class="tool" id="restart">↻ 重开</button></div></main><div class="modal" id="modal"><div class="card"><h1>挪对对</h1><p>地狱模式<br>麻将必须完全相同，沿直线挪到无遮挡的位置即可成对消除。<br>开局满屏铺牌，先找相邻对子，祝你好运！</p><button class="start" id="begin">开始挑战</button></div></div><script>
const R=24,C=20,types=["一万","二万","三万","四万","五万","六万","七万","八万","九万","一条","二条","三条","四条","五条","六条","七条","八条","九条","一饼","二饼","三饼","四饼","五饼","六饼","七饼","八饼","九饼","东","南","西","北","中","发","白"];let g=[],selected=null,score=0,hints=3,bombs=1,paused=false;const $=id=>document.getElementById(id);function make(){let a=[];for(let i=0;i<R*C/2;i++)a.push(types[i%types.length],types[i%types.length]);a.sort(()=>Math.random()-.5);g=Array.from({length:R},()=>Array(C).fill(null));let k=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++)g[r][c]=a[k++];selected=null;render()}function render(){let b=$('board');b.innerHTML='';g.forEach((row,r)=>row.forEach((v,c)=>{let x=document.createElement('div');x.className='cell '+(v?'':'empty')+(selected&&selected[0]==r&&selected[1]==c?' selected':'');x.textContent=v||'';x.dataset.r=r;x.dataset.c=c;b.append(x)}));$('score').textContent=score;$('hint').innerHTML=`💡 提示 <span>${hints}</span>`;$('bomb').innerHTML=`💣 炸弹 <span>${bombs}</span>`}function clearPath(a,b){if(a[0]===b[0]){for(let c=Math.min(a[1],b[1])+1;c<Math.max(a[1],b[1]);c++)if(g[a[0]][c])return false;return true}if(a[1]===b[1]){for(let r=Math.min(a[0],b[0])+1;r<Math.max(a[0],b[0]);r++)if(g[r][a[1]])return false;return true}return false}function moves(){let out=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(g[r][c])for(let rr=0;rr<R;rr++)for(let cc=0;cc<C;cc++)if(g[rr][cc]===g[r][c]&&[r,c].toString()!==[rr,cc].toString()&&clearPath([r,c],[rr,cc]))out.push([[r,c],[rr,cc]]);return out}function act(r,c){if(paused)return;if(!g[r][c]&&!selected){$('status').textContent='这里不是空位';return}if(!selected){selected=[r,c];$('status').textContent='选择同牌或空位';render();return}let a=selected,b=[r,c];if(g[r][c]&&g[r][c]===g[a[0]][a[1]]&&clearPath(a,b)){g[a[0]][a[1]]=null;g[r][c]=null;score+=10;$('status').textContent='配对成功！继续扫描新通路';selected=null;render();if(!g.flat().some(Boolean)){setTimeout(()=>alert('通关！地狱模式也被你挪空了。'),80)}else if(!moves().length)$('status').textContent='死局：请使用洗牌或炸弹'}else if(!g[r][c]&&clearPath(a,b)){g[r][c]=g[a[0]][a[1]];g[a[0]][a[1]]=null;selected=[r,c];$('status').textContent='已挪动，选择同牌完成消除';render()}else{selected=g[r][c]?[r,c]:selected;$('status').textContent='只能沿无遮挡直线移动';render()}}$('board').addEventListener('click',e=>{let x=e.target.closest('.cell');if(x)act(+x.dataset.r,+x.dataset.c)});$('begin').onclick=()=>{$('modal').classList.add('hide');make()};$('restart').onclick=()=>{score=0;make()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('status').textContent=paused?'已暂停':'继续挑战'};$('shuffle').onclick=()=>{let a=g.flat().filter(Boolean).sort(()=>Math.random()-.5),i=0;g=g.map(row=>row.map(v=>v?a[i++]:null));selected=null;$('status').textContent='牌面已洗乱';render()};$('bomb').onclick=()=>{if(!bombs)return;let p=[];g.forEach((row,r)=>row.forEach((v,c)=>v&&p.push([r,c])));p.sort(()=>Math.random()-.5);p.slice(0,2).forEach(([r,c])=>g[r][c]=null);bombs--;selected=null;$('status').textContent='炸弹移除了两张牌';render()};$('hint').onclick=()=>{if(!hints)return;let m=moves()[0];if(!m){$('status').textContent='当前没有可行配对';return}hints--;m.flat().forEach(([r,c])=>{let x=[...document.querySelectorAll('.cell')].find(e=>+e.dataset.r===r&&+e.dataset.c===c);x?.classList.add('hint')});$('status').textContent='高亮的是一组可行配对';render();setTimeout(render,1800)};$('menu').onclick=()=>alert('地狱模式：无倒计时，消除全部麻将即可通关。');
</script></body></html>
